<nav aria-label="Breadcrumbs" class="mb-md">
  <ol class="breadcrumbs">
    <li class="breadcrumb-item">
      <a href="{% url 'accounts:dashboard' %}">Dashboard</a>
    </li>
    {% for item in items %}
      {% if forloop.last %}
        <li class="breadcrumb-item is-active" aria-current="page">{{ item.title }}</li>
      {% else %}
        <li class="breadcrumb-item">
          <a href="{{ item.url }}">{{ item.title }}</a>
        </li>
      {% endif %}
    {% endfor %}
  </ol>
</nav>
