{% extends "layouts/public_base.html" %}

{% block title %}Password Changed | RocketBank{% endblock %}

{% block content %}
<div class="container container--narrow text-center" style="padding: var(--space-2xl) 0;">
  <div class="card card--elevated p-xl">
    <div style="font-size: 3rem; margin-bottom: var(--space-md);" aria-hidden="true">🔒</div>
    <h1 style="font-size: var(--font-size-2xl);">Password Changed Successfully!</h1>
    <p class="text-secondary mb-xl">
      Your account password has been updated. You can now use your new password to sign in.
    </p>
    <a href="{% url 'users:login' %}" class="btn btn--primary btn--lg">Sign In Now</a>
  </div>
</div>
{% endblock %}
