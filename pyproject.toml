[project]
name = "rocketbank"
version = "0.1.0"
description = "Production-grade banking platform"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C90"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*" = ["E501"]
"apps/core/translations.py" = ["E501"]
"scripts/*" = ["E501", "C901"]

